<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Quiz Modular</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #f0f4f9;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 20px;
            color: #1a2c3e;
        }
        .quiz-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 36px;
            box-shadow: 0 16px 32px rgba(0,0,0,0.08);
            overflow: hidden;
            padding: 1.8rem 2rem 2rem;
        }
        @media (max-width: 600px) {
            .quiz-container { padding: 1.2rem; }
        }
        .progress-wrapper {
            margin-bottom: 1.5rem;
        }
        .progress-bar-bg {
            background: #e2e8f0;
            height: 6px;
            border-radius: 8px;
        }
        .progress-fill {
            background: #2c7a5e;
            height: 6px;
            border-radius: 8px;
            width: 0%;
            transition: width 0.25s ease;
        }
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 0.75rem;
        }
        .q-counter {
            font-size: 0.8rem;
            font-weight: 500;
            background: #eef2f8;
            padding: 4px 14px;
            border-radius: 40px;
            color: #2c4f6e;
        }
        .q-topic {
            font-size: 0.75rem;
            background: #e0e9f2;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 500;
            color: #1f5068;
        }
        .q-text {
            font-size: 1.3rem;
            font-weight: 550;
            line-height: 1.45;
            margin: 1rem 0 1.3rem;
            color: #0b2f44;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 1.5rem;
        }
        .opt-btn {
            background: white;
            border: 1px solid #dce5ef;
            border-radius: 24px;
            padding: 0.85rem 1.2rem;
            font-size: 0.94rem;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.12s;
            font-family: inherit;
            color: #1a2c3e;
        }
        .opt-btn:hover:not(:disabled) {
            background: #fafcff;
            border-color: #94a9c2;
            transform: translateY(-1px);
        }
        .opt-letter {
            font-weight: 700;
            background: #eef2f8;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            font-size: 0.85rem;
        }
        .opt-btn.correct {
            background: #e0f2ea;
            border-color: #2c7a5e;
        }
        .opt-btn.correct .opt-letter {
            background: #c8e6db;
            color: #145c46;
        }
        .opt-btn.wrong {
            background: #feeceb;
            border-color: #cf7a7a;
        }
        .opt-btn.wrong .opt-letter {
            background: #fad8d8;
            color: #b14b4b;
        }
        .opt-btn:disabled {
            cursor: default;
        }
        .feedback {
            margin: 1rem 0 1.2rem;
            padding: 0.9rem 1.3rem;
            border-radius: 24px;
            font-size: 0.9rem;
            line-height: 1.45;
            display: none;
            white-space: pre-line; /* 👈 Add this line */

        }
        .feedback.correct {
            background: #e0f2ea;
            border-left: 5px solid #2c7a5e;
            color: #135a45;
        }
        .feedback.wrong {
            background: #feeceb;
            border-left: 5px solid #cf7a7a;
            color: #9b3e3e;
        }
        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.3rem;
        }
        .score-inline {
            font-size: 0.85rem;
            font-weight: 500;
            background: #f0f4f9;
            padding: 6px 16px;
            border-radius: 40px;
        }
        .btn {
            background: white;
            border: 1px solid #cbdde9;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
            font-family: inherit;
        }
        .btn-primary {
            background: #2c7a5e;
            border-color: #2c7a5e;
            color: white;
        }
        .btn-primary:hover {
            background: #1e5f48;
        }
        .btn:hover {
            background: #eef3fc;
        }
        .result-screen {
            text-align: center;
            padding: 1rem 0.5rem;
        }
        .final-score {
            font-size: 4rem;
            font-weight: 700;
            color: #2c7a5e;
            margin: 0.5rem 0;
        }
        .score-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1.5rem 0;
        }
       .stat-card {
            background: #f8fafd;
            padding: 0.7rem 1.8rem;
            border-radius: 48px;
            text-align: center;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
        }
        .green-txt { color: #2c7a5e; }
        .red-txt { color: #c86363; }
        button:active { transform: scale(0.97);}
    </style>
</head>
<body>
<div class="quiz-container" id="quizContainer">
    <div id="quizMain">
        <div class="progress-wrapper">
            <div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="q-header">
            <span class="q-counter" id="qCounter">Pergunta 1 de 49</span>
            <span class="q-topic" id="qTopic">Carregando...</span>
        </div>
        <div class="q-text" id="qText"></div>
        <div class="options" id="optionsArea"></div>
        <div class="feedback" id="feedbackMsg"></div>
        <div class="nav-row">
            <div class="score-inline" id="scoreInline">✔️ 0 &nbsp; ❌ 0</div>
            <button class="btn btn-primary" id="nextBtn" style="display: none;">Próxima →</button>
        </div>
    </div>
    <div id="resultArea" style="display: none;">
        <div class="result-screen">
            <div class="final-score" id="finalPercent"></div>
            <p style="color: #2c506d; margin-bottom: 0.2rem;" id="resultMsg"></p>
            <div class="score-stats">
                <div class="stat-card"><div class="stat-number green-txt" id="finalCorrect"></div><div class="stat-label">Corretas</div></div>
                <div class="stat-card"><div class="stat-number red-txt" id="finalWrong"></div><div class="stat-label">Erradas</div></div>
            </div>
            <button class="btn btn-primary" id="restartBtn">🔄 Recomeçar (Ordem aleatória)</button>
        </div>
    </div>
</div>

let allQuestions = [...anatomiaQuestions2023_2024, ...anatomiaQuestions2024_2025];

    // Embaralhar (ordem aleatória)
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    let shuffledQuestions = [];
    let currentIndex = 0;
    let userScore = 0;
    let wrongCount = 0;
    let answered = false;

    // DOM elements
    const quizMain = document.getElementById('quizMain');
    const resultDiv = document.getElementById('resultArea');
    const progressFill = document.getElementById('progressFill');
    const qCounterSpan = document.getElementById('qCounter');
    const qTopicSpan = document.getElementById('qTopic');
    const qTextDiv = document.getElementById('qText');
    const optionsDiv = document.getElementById('optionsArea');
    const feedbackDiv = document.getElementById('feedbackMsg');
    const nextBtn = document.getElementById('nextBtn');
    const scoreInlineSpan = document.getElementById('scoreInline');

    function updateProgress() {
        const percent = ((currentIndex + 1) / shuffledQuestions.length) * 100;
        progressFill.style.width = `${percent}%`;
        qCounterSpan.innerText = `Pergunta ${currentIndex+1} de ${shuffledQuestions.length}`;
    }

    function updateScoreText() {
        scoreInlineSpan.innerHTML = `✔️ ${userScore} &nbsp; ❌ ${wrongCount}`;
    }

    function renderCurrentQuestion() {
        const q = shuffledQuestions[currentIndex];
        qTopicSpan.innerText = q.topic;
        qTextDiv.innerText = q.text;
        optionsDiv.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D', 'E'];
        q.opts.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span><span>${opt}</span>`;
            btn.addEventListener('click', () => selectOption(idx));
            optionsDiv.appendChild(btn);
        });
        feedbackDiv.style.display = 'none';
        feedbackDiv.className = 'feedback';
        nextBtn.style.display = 'none';
        answered = false;
    }

function selectOption(selectedIdx) {
    if (answered) return;
    answered = true;
    const q = shuffledQuestions[currentIndex];
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(btn => btn.disabled = true);

    const correctAnswers = Array.isArray(q.answer) ? q.answer : [q.answer];
    const isCorrect = correctAnswers.includes(selectedIdx);

    correctAnswers.forEach(i => btns[i].classList.add('correct'));

    if (isCorrect) {
        userScore++;
        feedbackDiv.classList.add('correct');
        feedbackDiv.innerHTML = `✅ Correto! ${q.explanation}`;
    } else {
        wrongCount++;
        btns[selectedIdx].classList.add('wrong');
        feedbackDiv.classList.add('wrong');
        const correctLetters = correctAnswers.map(i => String.fromCharCode(65 + i)).join(' e ');
        feedbackDiv.innerHTML = `❌ Incorreto. Respostas certas: ${correctLetters}. ${q.explanation}`;
    }

    updateScoreText();
    feedbackDiv.style.display = 'block';
    nextBtn.style.display = 'block';
}

    function nextQuestion() {
        if (currentIndex + 1 < shuffledQuestions.length) {
            currentIndex++;
            renderCurrentQuestion();
            updateProgress();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        quizMain.style.display = 'none';
        resultDiv.style.display = 'block';
        const percent = Math.round((userScore / shuffledQuestions.length) * 100);
        document.getElementById('finalPercent').innerHTML = `${percent}%`;
        document.getElementById('finalCorrect').innerText = userScore;
        document.getElementById('finalWrong').innerText = wrongCount;
        let msg = '';
        if (percent >= 85) msg = 'Excelente domínio da anatomia II!';
        else if (percent >= 65) msg = 'Bom desempenho! Reveja alguns tópicos para consolidar.';
        else msg = 'É continuar a estudar';
        document.getElementById('resultMsg').innerText = msg;
    }
//[...lipidQuestions, ...proteinQuestions, ...newQuestions]
    function restartQuiz() {
        shuffledQuestions = shuffleArray(allQuestions);
        currentIndex = 0;
        userScore = 0;
        wrongCount = 0;
        answered = false;
        updateScoreText();
        quizMain.style.display = 'block';
        resultDiv.style.display = 'none';
        renderCurrentQuestion();
        updateProgress();
    }

    nextBtn.addEventListener('click', nextQuestion);
    document.getElementById('restartBtn').addEventListener('click', restartQuiz);

    // Inicialização
    shuffledQuestions = shuffleArray(allQuestions);
    renderCurrentQuestion();
    updateProgress();
    updateScoreText();
</script>
