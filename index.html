<script>
    // ======================= SEÇÃO V – METABOLISMO DOS LIPÍDEOS (30 questões, conforme PDF CORRIGIDO) =======================
    const lipidQuestions = [
        { topic: "Ácidos graxos", text: "1. Qual das afirmativas a seguir relacionadas às moléculas de ácidos graxos está CORRETA?", opts: ["Elas consistem em um grupo cabeça de ácido carboxílico ligado a uma cadeia de carboidratos.", "Elas são chamadas de poliinsaturadas quando contêm uma ou mais duplas ligações carbono-carbono.", "Os seus pontos de fusão aumentam com o aumento do número de insaturações.", "Elas quase sempre têm suas duplas ligações na configuração cis quando ocorrem naturalmente.", "Elas ocorrem no organismo, principalmente, na forma de ácidos graxos livres (não esterificados)."], answer: 3, explanation: "Os ácidos graxos naturais têm duplas ligações quase sempre em configuração cis, o que influencia a fluidez das membranas." },
        { topic: "Fosfolipídeos", text: "2. Qual dos seguintes NÃO é um fosfolipídeo?", opts: ["Esfingomielina", "Plasmalogênio", "Cardiolipina", "Galactosilceramida", "Lisolecitina"], answer: 3, explanation: "Galactosilceramida é um glicoesfingolipídeo (cerebrosídeo), não contém fosfato. Os demais são fosfolipídeos." },
        { topic: "Gangliosídeos", text: "3. Qual das afirmativas a seguir sobre gangliosídeos está INCORRETA?", opts: ["Eles são derivados da galatosilceramida.", "Eles contêm uma molécula ou mais de ácido siálico.", "Eles estão presentes no tecido nervoso em altas concentrações.", "O gangliosídeo GM1 é o receptor da toxina colérica no intestino humano.", "Eles atuam no reconhecimento célula a célula."], answer: 0, explanation: "Gangliosídeos são derivados da glicosilceramida, e não da galactosilceramida." },
        { topic: "Antioxidantes", text: "4. Qual dos seguintes é um antioxidante que quebra a cadeia?", opts: ["Glutationa-peroxidase", "Selênio", "Superóxido-dismutase", "EDTA", "Catalase"], answer: 2, explanation: "A Superóxido-dismutase (SOD) é classificada como antioxidante que quebra a cadeia de radicais; as demais atuam como antioxidantes preventivos." },
        { topic: "Corpos cetônicos", text: "5. Depois de produzidos a partir de acetil-CoA no fígado, os corpos cetônicos são utilizados principalmente em qual dos processos a seguir?", opts: ["Excreção como resíduo.", "Geração de energia no fígado.", "Conversão de ácidos graxos para estoque de energia.", "Geração de energia nos tecidos.", "Geração de energia nas hemácias."], answer: 3, explanation: "Corpos cetônicos são exportados para tecidos extra-hepáticos (músculo, cérebro, coração) como fonte de energia." },
        { topic: "β-oxidação", text: "6. O local subcelular da quebra dos ácidos graxos de cadeia longa à acetil-CoA através da β-oxidação é:", opts: ["O citosol.", "A matriz mitocondrial.", "O retículo endoplasmático.", "O espaço intermembrana da mitocôndria.", "O aparelho de Golgi."], answer: 1, explanation: "A β-oxidação ocorre na matriz mitocondrial." },
        { topic: "Carnitina", text: "7. A carnitina é necessária para a oxidação de ácidos graxos PORQUE:", opts: ["Ela é um cofator para a acil-CoA-sintase, que ativa os ácidos graxos para a degradação.", "Acil-CoA de cadeia longa (“ácidos graxos ativados”) precisam entrar na matriz mitocondrial para serem oxidados, porém não podem atravessar a membrana mitocondrial externa. A transferência do grupo acil-CoA para a carnitina possibilita que o deslocamento ocorra.", "Acil-CoA de cadeia longa precisam entrar no espaço intermembrana da mitocôndria para serem oxidados, porém não podem atravessar a membrana mitocondrial interna. A transferência do grupo acil-CoA para a carnitina possibilita que o deslocamento ocorra.", "Previne a quebra de ácido graxo acil-CoA de cadeia longa no espaço intermembrana da mitocôndria."], answer: 2, explanation: "Os ácidos graxos de cadeia longa são ativados ao se ligarem à CoA, mas a acil-CoA graxo não consegue atravessar a membrana mitocondrial interna. Após a transferência do grupo acil da CoA para a carnitina pela carnitina-palmitoil-transferase (CPT)-I, a acilcarnitina é transportada através da membrana pela carnitina-acilcarnitina-translocase em troca de uma carnitina. Dentro da matriz, a CPT-II transfere o grupo acil de volta para a CoA, e a carnitina é levada de volta para o espaço intermembrana pela enzima-translocase." },
        { topic: "β-oxidação", text: "8. A degradação de uma molécula de um ácido graxo C16 completamente saturado (ácido palmítico) por β-oxidação leva à formação de:", opts: ["8 FADH2, 8 NADH e 8 moléculas de acetil-CoA", "7 FADH2, 7 NADH e 7 moléculas de acetil-CoA", "8 FADH2, 8 NADH e 7 moléculas de acetil-CoA", "7 FADH2, 8 NADH e 8 moléculas de acetil-CoA", "7 FADH2, 7 NADH e 8 moléculas de acetil-CoA"], answer: 4, explanation: "Palmitato (C16) requer 7 ciclos de β-oxidação → 7 FADH2, 7 NADH e 8 acetil-CoA." },
        { topic: "Malonil-CoA", text: "9. Malonil-CoA, o primeiro intermediário na síntese de ácidos graxos, é um importante regulador do metabolismo de ácidos graxos PORQUE:", opts: ["A sua formação a partir de acetil-CoA e bicarbonato pela enzima acetil-CoA-carboxilase é a principal etapa limitante da velocidade de síntese dos ácidos graxos.", "Previne a entrada de grupos de ácidos graxos acil na matriz mitocondrial porque é um potente inibidor da carnitina-palmitoil-transferase-I.", "Previne a entrada de grupos de ácidos graxos acil na matriz mitocondrial porque é um potente inibidor da carnitina-palmitoil-transferase-II.", "Previne a entrada de grupos de ácidos graxos acil na matriz mitocondrial porque é um potente inibidor da carnitina-acilcarnitina-transferase.", "Inibe a síntese do ácido graxo acil-CoA."], answer: 1, explanation: "Malonil-CoA inibe a CPT-I, impedindo a entrada de ácidos graxos na mitocôndria para oxidação." },
        { topic: "Essenciais", text: "10. O ácido α-linolênico é considerado nutricionalmente essencial para os seres humanos PORQUE:", opts: ["Ele é um ácido graxo ω3.", "Ele contém três duplas ligações.", "Em seres humanos, a dupla ligação não pode ser introduzida em ácidos graxos acima da posição Δ9.", "Em seres humanos, a dupla ligação não pode ser introduzida em ácidos graxos acima da posição Δ12.", "Tecidos humanos não são capazes de introduzir uma dupla ligação na posição Δ9 dos ácidos graxos."], answer: 2, explanation: "Humanos não possuem dessaturases para introduzir duplas ligações além da posição Δ9; portanto, ácidos graxos ω3 (como α-linolênico) e ω6 são essenciais." },
        { topic: "Regulação", text: "11. A inativação da acetil-CoA-carboxilase é favorecida QUANDO:", opts: ["Os níveis de citrato citosólico estão altos.", "Ela estiver na forma polimérica.", "Os níveis de palmitoil-CoA forem baixos.", "O transportador de tricarboxilatos estiver inibido.", "Ela estiver desfosforilada."], answer: 3, explanation: "A inibição do transportador de ácidos tricarboxílicos faz os níveis de citrato no citosol diminuírem, e isso favorece a inativação da enzima." },
        { topic: "Eicosanoides", text: "12. Qual dos eicosanoides a seguir é sintetizado a partir do ácido linoleico através da via da cicloxigenase?", opts: ["Prostaglandina E (PGE1).", "Leucotrieno A (LTA3).", "Prostaglandina E (PGE3).", "Lipoxina A (LXA4).", "Tromboxano A (TXA3)."], answer: 0, explanation: "A PGE1 é derivada do ácido dihomo-γ-linolênico (metabólito do ácido linoleico) via cicloxigenase." },
        { topic: "AINE", text: "13. Qual das enzimas a seguir é inibida pelo ácido acetilsalicílico, um anti-inflamatório não esteroide (AINE)?", opts: ["Lipoxigenase.", "Prostaciclina-sintase.", "Cicloxigenase.", "Tromboxano-sintase.", "Δ6-dessaturase."], answer: 2, explanation: "O AAS inibe irreversivelmente as cicloxigenases COX-1 e COX-2, reduzindo a síntese de prostaglandinas." },
        { topic: "Síntese AG", text: "14. Qual das opções a seguir é o principal produto do ácido graxo-sintase?", opts: ["Acetil-CoA.", "Oleato.", "Palmitoil-CoA.", "Acetacetato.", "Palmitato."], answer: 4, explanation: "O complexo ácido graxo-sintase (FAS) produz palmitato (C16:0)." },
        { topic: "Diferenças", text: "15. Qual das afirmativas a seguir relacionada a essas diferenças (degradação vs síntese) está INCORRETA?", opts: ["A degradação dos ácidos graxos ocorre dentro da mitocôndria, ao passo que a síntese ocorre no citosol.", "A degradação dos ácidos graxos utiliza NAD+ e produz NADH, ao passo que a síntese utiliza NADPH e produz NADP+.", "Os grupos de ácidos graxos acil são ativados para separação utilizando CoA e para síntese utilizando a proteína carreadora de grupos acila.", "O transporte através da membrana mitocondrial de grupos de ácidos graxos acil e acetil-CoA é necessário para a degradação e síntese de ácidos graxos, respectivamente.", "O glucagon promove a síntese de ácidos graxos e inibe a degradação dos ácidos graxos."], answer: 4, explanation: "O glucagon inibe a síntese e estimula a degradação (lipólise). Afirmativa incorreta." },
        { topic: "Lipase sensível", text: "16. A lipase sensível a hormônio, a enzima que mobiliza ácidos graxos a partir dos estoques de triacilgliceróis no tecido adiposo, é inibida por:", opts: ["Glucagon.", "ACTH.", "Epinefrina.", "Vasopressina.", "Prostaglandina E."], answer: 4, explanation: "A prostaglandina E (PGE) inibe a HSL; os demais hormônios a ativam via AMPc." },
        { topic: "Fosfolipase C", text: "17. Qual das alternativas a seguir melhor descreve a ação da fosfolipase C?", opts: ["Ela libera a cadeia de acil da posição sn-2 de um fosfolipídeo.", "Ela cliva um fosfolipídeo em seu grupo principal contendo fosfato e um diacilglicerol.", "Ela libera o grupo principal de um fosfolipídeo, gerando ácido fosfatídico.", "Ela libera a cadeia de acil da posição sn-1 de um fosfolipídeo.", "Ela libera as cadeias de acil das posições sn-1 e sn-2 de um fosfolipídeo."], answer: 1, explanation: "A fosfolipase C cliva o fosfolipídeo entre o glicerol e o fosfato, gerando diacilglicerol (DAG) e um grupo cabeça fosforilado (ex: IP3)." },
        { topic: "Tay-Sachs", text: "18. O distúrbio de Tay Sachs é uma doença de armazenamento de lipídeo causada por um defeito genético que causa a deficiência de qual das enzimas a seguir:", opts: ["β-Galactosidase.", "Esfingomielinase.", "Ceramidase.", "Hexosaminidase A.", "β-Glicosidase."], answer: 3, explanation: "A doença de Tay-Sachs é causada por deficiência da hexosaminidase A, levando ao acúmulo de GM2." },
        { topic: "Lipoproteínas", text: "19. Qual das lipoproteínas plasmáticas é melhor descrita como: sintetizada na mucosa intestinal, contendo alta concentração de triacilglicerol e responsável pelo transporte de lipídeos da dieta pela circulação?", opts: ["Quilomícrons.", "Lipoproteína de alta densidade.", "Lipoproteína de densidade intermediária.", "Lipoproteína de baixa densidade.", "Lipoproteína de densidade muito baixa."], answer: 0, explanation: "Os quilomícrons transportam lipídeos exógenos da dieta." },
        { topic: "Lipoproteínas", text: "20. Qual das lipoproteínas plasmáticas é melhor descrita como: sintetizada no fígado, contendo alta concentração de triacilglicerol e eliminada da circulação principalmente pelos tecidos adiposo e muscular?", opts: ["Quilomícrons.", "Lipoproteína de alta densidade.", "Lipoproteína de densidade intermediária.", "Lipoproteína de baixa densidade.", "Lipoproteína de densidade muito baixa."], answer: 4, explanation: "A VLDL (lipoproteína de densidade muito baixa) é sintetizada no fígado e fornece ácidos graxos aos tecidos periféricos." },
        { topic: "Lipoproteínas", text: "21. Qual das lipoproteínas plasmáticas é melhor descrita como: formada na circulação pela remoção de triacilglicerol das lipoproteínas de densidade muito baixa, contém colesterol captado da lipoproteína de alta densidade e entrega o colesterol para os tecidos extra-hepáticos?", opts: ["Quilomícrons.", "Lipoproteína de alta densidade.", "Lipoproteína de densidade intermediária.", "Lipoproteína de baixa densidade.", "Lipoproteína de densidade muito baixa."], answer: 3, explanation: "A LDL (lipoproteína de baixa densidade) é a principal transportadora de colesterol para os tecidos." },
        { topic: "Pós-prandial", text: "22. Qual das seguintes estará elevada na corrente sanguínea cerca de 2 horas após a ingestão de uma refeição rica em gordura?", opts: ["Quilomícrons.", "Lipoproteína de alta densidade.", "Corpos cetônicos.", "Ácidos graxos não esterificados.", "Lipoproteína de muito baixa densidade."], answer: 0, explanation: "Os quilomícrons aparecem na circulação após a absorção de gorduras da dieta." },
        { topic: "Pós-prandial tardio", text: "23. Qual das seguintes estará elevada na corrente sanguínea cerca de 4 horas após a ingestão de uma refeição rica em gordura?", opts: ["Quilomícrons.", "Lipoproteína de alta densidade.", "Corpos cetônicos.", "Ácidos graxos não esterificados.", "Lipoproteína de muito baixa densidade."], answer: 4, explanation: "Após a remoção dos quilomícrons, o fígado aumenta a secreção de VLDL." },
        { topic: "Transporte reverso", text: "24. Qual dos processos a seguir NÃO está envolvido no efluxo de colesterol dos tecidos extra-hepáticos e na entrega do colesterol para o fígado para excreção através da HDL?", opts: ["Efluxo de colesterol dos tecidos para pré-β HDL através de ABCA1.", "Esterificação do colesterol a éster de colesteril pela LCAT, formando HDL3.", "Transferência de éster de colesteril do HDL para VLDL, IDL e LDL pela ação da proteína de transferência de éster de colesteril (CETP).", "Efluxo de colesterol dos tecidos para HDL3 através de SR-B1 e ABCG1.", "Captação seletiva de éster de colesterila a partir de HDL2 pelo fígado através de SR-B1."], answer: 2, explanation: "A CETP transfere éster de colesteril da HDL para VLDL/LDL, o que não favorece diretamente a excreção hepática, mas sim o retorno a tecidos periféricos." },

        const percent = ((currentIndex + 1) / shuffledQuestions.length) * 100;
        progressFill.style.width = `${percent}%`;
        qCounterSpan.innerText = `Pergunta ${currentIndex+1} de ${shuffledQuestions.length}`;
    }

    function updateScoreText() {
        scoreInlineSpan.innerHTML = `✔️ ${userScore} &nbsp; ❌ ${wrongCount}`;
    }

    function renderCurrentQuestion() {
        const q = shuffledQuestions[currentIndex];
        qTopicSpan.innerText = q.topic;
        qTextDiv.innerText = q.text;
        optionsDiv.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D', 'E'];
        q.opts.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span><span>${opt}</span>`;
            btn.addEventListener('click', () => selectOption(idx));
            optionsDiv.appendChild(btn);
        });
        feedbackDiv.style.display = 'none';
        feedbackDiv.className = 'feedback';
        nextBtn.style.display = 'none';
        answered = false;
    }

    function selectOption(selectedIdx) {
        if (answered) return;
        answered = true;
        const q = shuffledQuestions[currentIndex];
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(btn => btn.disabled = true);
        const correctIdx = q.answer;
        btns[correctIdx].classList.add('correct');
        const isCorrect = (selectedIdx === correctIdx);
        if (isCorrect) {
            userScore++;
            feedbackDiv.classList.add('correct');
            feedbackDiv.innerHTML = `✅ Correto! ${q.explanation}`;
        } else {
            wrongCount++;
            btns[selectedIdx].classList.add('wrong');
            feedbackDiv.classList.add('wrong');
            const correctLetter = String.fromCharCode(65 + correctIdx);
            feedbackDiv.innerHTML = `❌ Incorreto. Resposta certa: ${correctLetter}. ${q.explanation}`;
        }
        updateScoreText();
        feedbackDiv.style.display = 'block';
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        if (currentIndex + 1 < shuffledQuestions.length) {
            currentIndex++;
            renderCurrentQuestion();
            updateProgress();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        quizMain.style.display = 'none';
        resultDiv.style.display = 'block';
        const percent = Math.round((userScore / shuffledQuestions.length) * 100);
        document.getElementById('finalPercent').innerHTML = `${percent}%`;
        document.getElementById('finalCorrect').innerText = userScore;
        document.getElementById('finalWrong').innerText = wrongCount;
        let msg = '';
        if (percent >= 85) msg = 'Excelente domínio do metabolismo lipídico e de aminoácidos!';
        else if (percent >= 65) msg = 'Bom desempenho! Reveja alguns tópicos para consolidar.';
        else msg = 'Revise os ciclos da β-oxidação, lipoproteínas e metabolismo do nitrogênio.';
        document.getElementById('resultMsg').innerText = msg;
    }
//[...lipidQuestions, ...proteinQuestions, ...newQuestions]
    function restartQuiz() {
        shuffledQuestions = shuffleArray([...lipidQuestions, ...proteinQuestions, ...newQuestions]);
        currentIndex = 0;
        userScore = 0;
        wrongCount = 0;
        answered = false;
        updateScoreText();
        quizMain.style.display = 'block';
        resultDiv.style.display = 'none';
        renderCurrentQuestion();
        updateProgress();
    }

    nextBtn.addEventListener('click', nextQuestion);
    document.getElementById('restartBtn').addEventListener('click', restartQuiz);

    // Inicialização
    shuffledQuestions = shuffleArray([...lipidQuestions, ...proteinQuestions, ...newQuestions]);
    renderCurrentQuestion();
    updateProgress();
    updateScoreText();
</script>
</body>
</html>
